# Site identity
title: "Screeps Combat Lab"
masthead_title: "Screeps Combat Lab"
subtitle: "Combat AI · Bot Design · Research"
name: "Screeps Combat Lab"
description: >-
  Engineering notes, tutorials, experiments, and battle reports about building
  capable combat bots for Screeps.

# User site settings for https://txra0.github.io/
url: "https://txra0.github.io"
baseurl: ""
repository: "TXRA0/txra0.github.io"

# Minimal Mistakes remote theme
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "air"

locale: "en-GB"
timezone: "Europe/London"

# Site behaviour
search: true
breadcrumbs: true
words_per_minute: 180
read_time: true
show_date: true
date_format: "%d %B %Y"
future: false

# Blog URLs and pagination
permalink: /:year/:month/:day/:title/
paginate: 8
paginate_path: /page:num/

# Author card
author:
  name: "Screeps Combat Lab"
  bio: "Engineering notes on Screeps combat AI, bot architecture, and experiments."
  location: "Screeps World"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/TXRA0"
    - label: "Screeps Documentation"
      icon: "fas fa-fw fa-book"
      url: "https://docs.screeps.com/"

plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

include:
  - .htaccess
  - _pages

exclude:
  - .github
  - .bundle
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - POST_TEMPLATE.md
  - README.md
  - LICENSE
  - README.txt

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true
      toc: true
      toc_sticky: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      share: false
      comments: false

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
